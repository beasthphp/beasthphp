<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="80" x2="1035" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glow"/>
      <feColorMatrix in="glow" type="matrix" values="0.345 0 0 0 0.02  0 0.651 0 0 0.36  0 0 1 0 1  0 0 0 .35 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#30363D" stroke-width="1" opacity="0.32"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
